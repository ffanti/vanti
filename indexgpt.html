<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Yosefina Ivanti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background: linear-gradient(135deg,#0f172a,#1e293b,#312e81);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      color:white;
    }

    .background-circle{
      position:absolute;
      border-radius:50%;
      filter:blur(80px);
      opacity:0.4;
      animation: float 8s infinite alternate;
    }

    .circle1{
      width:300px;
      height:300px;
      background:#9333ea;
      top:-50px;
      left:-50px;
    }

    .circle2{
      width:250px;
      height:250px;
      background:#06b6d4;
      bottom:-50px;
      right:-50px;
    }

    @keyframes float{
      from{
        transform:translateY(0px);
      }
      to{
        transform:translateY(30px);
      }
    }

    .card{
      position:relative;
      width:90%;
      max-width:900px;
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.2);
      backdrop-filter:blur(15px);
      border-radius:25px;
      padding:40px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
      display:grid;
      grid-template-columns:1fr 1.5fr;
      gap:30px;
      z-index:10;
    }

    .profile-left{
      text-align:center;
    }

    .profile-left img{
      width:220px;
      height:220px;
      object-fit:cover;
      border-radius:50%;
      border:5px solid rgba(255,255,255,0.3);
      box-shadow:0 0 25px rgba(255,255,255,0.4);
      transition:0.4s;
    }

    .profile-left img:hover{
      transform:scale(1.05);
    }

    .profile-left h1{
      margin-top:20px;
      font-size:32px;
      font-weight:700;
    }

    .nickname{
      color:#c4b5fd;
      font-size:18px;
      margin-top:5px;
    }

    .profile-right h2{
      font-size:28px;
      margin-bottom:20px;
      color:#a5f3fc;
    }

    .info{
      margin-bottom:18px;
      padding:15px;
      border-radius:15px;
      background:rgba(255,255,255,0.08);
      transition:0.3s;
    }

    .info:hover{
      transform:translateX(10px);
      background:rgba(255,255,255,0.15);
    }

    .info span{
      font-weight:600;
      color:#c4b5fd;
    }

    .skills{
      margin-top:20px;
    }

    .skill-box{
      margin-bottom:15px;
    }

    .skill-title{
      display:flex;
      justify-content:space-between;
      margin-bottom:6px;
    }

    .bar{
      width:100%;
      height:10px;
      background:rgba(255,255,255,0.2);
      border-radius:20px;
      overflow:hidden;
    }

    .fill{
      height:100%;
      border-radius:20px;
      background:linear-gradient(to right,#22d3ee,#a855f7);
    }

    .footer{
      margin-top:25px;
      text-align:center;
      font-size:14px;
      opacity:0.8;
    }

    @media(max-width:768px){
      .card{
        grid-template-columns:1fr;
        text-align:center;
      }

      .profile-right h2{
        text-align:center;
      }
    }
  </style>
</head>
<body>

  <div class="background-circle circle1"></div>
  <div class="background-circle circle2"></div>

  <div class="card">

    <div class="profile-left">
      <img src="https://i.imgur.com/2DhmtJ4.png" alt="Foto Profil">

      <h1>YOSEFINA IVANTI</h1>
      <p class="nickname">"VANTI"</p>
    </div>

    <div class="profile-right">

      <h2>✨ Personal Profile</h2>

      <div class="info">
        <span>Tempat, Tanggal Lahir:</span><br>
        Pongkal, 03 September 2006
      </div>

      <div class="info">
        <span>Hobi Akademik:</span><br>
        Membaca
      </div>

      <div class="info">
        <span>Hobi Non Akademik:</span><br>
        Menyanyi
      </div>

      <div class="info">
        <span>Status:</span><br>
        Mahasiswi Universitas Mahasaraswati
      </div>

      <div class="skills">
        <h2>🎯 Skill</h2>

        <div class="skill-box">
          <div class="skill-title">
            <p>Komunikasi</p>
            <p>90%</p>
          </div>
          <div class="bar">
            <div class="fill" style="width:90%"></div>
          </div>
        </div>

        <div class="skill-box">
          <div class="skill-title">
            <p>Membaca</p>
            <p>95%</p>
          </div>
          <div class="bar">
            <div class="fill" style="width:95%"></div>
          </div>
        </div>

        <div class="skill-box">
          <div class="skill-title">
            <p>Menyanyi</p>
            <p>85%</p>
          </div>
          <div class="bar">
            <div class="fill" style="width:85%"></div>
          </div>
        </div>

      </div>

      <div class="footer">
        © 2026 | Designed with ❤️ by Vanti
      </div>

    </div>

  </div>

</body>
</html>
